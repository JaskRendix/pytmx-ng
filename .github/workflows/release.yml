name: Release on tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build and lint dependencies
        run: |
          pip install setuptools-scm ruff build twine

      - name: Lint with Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check

      - name: Validate tag matches setuptools-scm version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Git tag version: $TAG_VERSION"
          SCM_VERSION=$(python -c "from setuptools_scm import get_version; print(get_version())")
          echo "setuptools-scm version: $SCM_VERSION"
          if [ "$TAG_VERSION" != "$SCM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match setuptools-scm version ($SCM_VERSION)."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
